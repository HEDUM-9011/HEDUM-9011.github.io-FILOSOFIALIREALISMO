    const el = (tag, cls, text) => {

      if (text != null) n.textContent = text;
      return n;
    };

      const card = el("article", "card" + (sec.destacada ? " destacada" : ""));
      card.id = tab.id + "-" + sec.id;
      card.appendChild(el("h3", null, sec.titulo));

      if (sec.modo === "parrafos") {
        sec.items.forEach(i => card.appendChild(el("p", null, i.text)));
        return card;
      }

      const ul = el("ul");
      sec.items.forEach(i => {
        const li = el("li");
        if (i.label) {
          li.appendChild(el("span", "label", i.label + ": "));
        }
        li.appendChild(document.createTextNode(i.text));
        ul.appendChild(li);
      });
      card.appendChild(ul);
      return card;

      if (tab.boton) {
        const a = el("a", "btn", tab.boton.texto + " ↗");
        a.href = tab.boton.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        head.appendChild(a);
      }
      panel.appendChild(head);

      /* marcadores */
      const marks = el("nav", "marcadores");
      marks.setAttribute("aria-label", "Marcadores de " + tab.titulo);
      marks.appendChild(el("span", null, "Marcadores"));
      tab.secciones.forEach(sec => {
        const a = el("a", null, sec.titulo.replace(/^Críticas (a|al) /, ""));
        a.href = "#" + tab.id + "/" + sec.id;
        marks.appendChild(a);
      });
      if (tab.comentarios) {
        const a = el("a", null, "💬 " + tab.comentarios.titulo);
        a.href = "#" + tab.id + "/" + tab.comentarios.id;
        marks.appendChild(a);
      }
      panel.appendChild(marks);

      /* secciones */
      tab.secciones.forEach(sec => panel.appendChild(renderSection(tab, sec)));

      /* comentarios giscus */
      if (tab.comentarios) {
        const box = el("section", "comentarios");
        box.id = tab.id + "-" + tab.comentarios.id;
        box.appendChild(el("h3", null, tab.comentarios.titulo));
        box.appendChild(el("p", "nota", tab.comentarios.nota));
        const holder = el("div");
        holder.id = "giscus-container";
        box.appendChild(holder);
        panel.appendChild(box);
      }

      panels.appendChild(panel);
    });

    /* ---------- GISCUS ---------- */
    function loadGiscus() {
      if (giscusLoaded.done) return;
      giscusLoaded.done = true;
      const s = document.createElement("script");
      s.src = "https://giscus.app/client.js";
      s.async = true;
      s.crossOrigin = "anonymous";
      s.setAttribute("data-repo", GISCUS.repo);
      s.setAttribute("data-repo-id", GISCUS.repoId);
      s.setAttribute("data-category", GISCUS.category);
      s.setAttribute("data-category-id", GISCUS.categoryId);
      s.setAttribute("data-mapping", GISCUS.mapping);
      s.setAttribute("data-strict", "0");
      s.setAttribute("data-reactions-enabled", "1");
      s.setAttribute("data-emit-metadata", "0");
      s.setAttribute("data-input-position", GISCUS.inputPosition);
      s.setAttribute("data-theme", GISCUS.theme);
      s.setAttribute("data-lang", GISCUS.lang);
      document.getElementById("giscus-container").appendChild(s);
    }

    /* ---------- NAVEGACIÓN ---------- */
    function show(tabId, secId) {
      const tab = DATA.tabs.find(t => t.id === tabId) || DATA.tabs[0];

      DATA.tabs.forEach(t => {
        const selected = t.id === tab.id;
        document.getElementById("tab-" + t.id).setAttribute("aria-selected", String(selected));
        document.getElementById("panel-" + t.id).hidden = !selected;
      });

      document.getElementById("tab-" + tab.id).scrollIntoView({ block: "nearest", inline: "center" });

      if (tab.comentarios) loadGiscus();

      const target = secId ? document.getElementById(tab.id + "-" + secId) : null;
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      } else {
        window.scrollTo({ top: 0 });
      }
      document.title = tab.titulo + " | Pensamiento político";
    }

    function route() {
      const [tabId, secId] = location.hash.replace("#", "").split("/");
      show(tabId, secId);
    }

    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
